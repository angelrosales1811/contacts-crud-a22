<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    class="dialog-btn dialog-btn-cancel"
    (click)="cancel()"
  >
    Cancelar
  </button>

  <button
    mat-button
    class="dialog-btn dialog-btn-delete"
    (click)="confirm()"
  >
    Eliminar
  </button>
</mat-dialog-actions>
