<div class="dashboard-container">

  <header class="dashboard-header">

    <div class="title-container">
      <span class="icon">📇</span>
      <h1>Contactos</h1>
    </div>

  </header>

  <div class="divider"></div>

  <section class="toolbar">

    <div class="search-container">

      <input
        type="text"
        placeholder="Buscar">

    </div>

<a
  routerLink="/contacts/new"
  class="create-link">

  <span>+</span>
  <span>Crear contacto</span>

</a>

  </section>

  <section class="contacts-grid">

    @for (contact of contacts(); track contact.id) {

      <article class="contact-card">

        <h3>{{ contact.name }}</h3>

        <p>{{ contact.email }}</p>

        <p>{{ contact.phone }}</p>

        <div class="actions">

          <button
            type="button"
            class="edit-btn">

            Editar

          </button>

          <button
            type="button"
            class="delete-btn"
            (click)="deleteContact(contact.id)">

            Eliminar

          </button>

        </div>

      </article>

    } @empty {

      <div class="empty-state">

        <p>No existen contactos registrados.</p>

      </div>

    }

  </section>

</div>
